name: Photo Library Monitor

# Main trigger: cron-job.org → workflow_dispatch with tick=true every 20 min.
# The gate step (scripts/photo_monitor_gate.py) decides in Paris time whether
# a tick actually runs: every 20 min on Strasbourg plenary days, hourly on
# weekday office hours, every 3h otherwise. GitHub's own `schedule` below is
# only a loose fallback — on 23/11/2026 it fired 4 times on a plenary day
# configured for every 20 min. A manual dispatch (tick empty) always runs.

on:
  schedule:
    # Times are UTC. Paris summer time (CEST) = UTC+2, so 09:00-18:00 Paris = 07:00-16:00 UTC.
    - cron: '0 7-16 * * 1-5'       # hourly, 09:00-18:00 Paris, Mon-Fri
    - cron: '0 0,3,6,18,21 * * 1-5' # every 3h outside that window, Mon-Fri
    - cron: '0 */3 * * 0,6'        # every 3h all day, Sat & Sun
    # Plenary-week 20-min ramp-up moved to cron-job.org + scripts/photo_monitor_gate.py
    # (EU sources only on the extra ticks). Don't re-add */20 lines here: they'd
    # run full scans, Getty/Imago included, every 20 min.
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      init_mode:
        description: 'Run in init mode (seed cache, no notifications)'
        required: false
        default: 'false'
      tick:
        description: 'Set by cron-job.org: let the gate decide whether to run'
        required: false
        default: ''

# During plenary weeks the hourly and every-30-min schedules collide at :00.
# Serialize runs so two workers don't both read the same seen.json and each
# fire a notification for the same new photo (the cache is per-run_id).
concurrency:
  group: photo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Gate (cron-job.org ticks)
        id: gate
        env:
          TICK: ${{ github.event.inputs.tick }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$TICK" = "true" ]; then
            python3 scripts/photo_monitor_gate.py
          else
            printf 'run=true\nmode=full\n' | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install playwright playwright-stealth feedparser requests supabase
          playwright install chromium
          playwright install-deps chromium

      - name: Restore seen-items cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: photo_library_seen.json
          key: seen-items-${{ github.run_id }}
          restore-keys: seen-items-

      - name: Run monitor (with virtual display)
        if: steps.gate.outputs.run == 'true'
        env:
          DISPLAY: ':99'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          if [ "${{ github.event.inputs.init_mode }}" = "true" ]; then
            python3 photo_library_monitor.py --init
          elif [ "$MODE" = "eu" ]; then
            python3 photo_library_monitor.py --eu-only   # plenary extra tick: EU sources only
          else
            python3 photo_library_monitor.py
          fi

      - name: Save seen-items
        uses: actions/cache/save@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          path: photo_library_seen.json
          key: seen-items-${{ github.run_id }}
