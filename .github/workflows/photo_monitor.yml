name: Photo Library Monitor

on:
  schedule:
    # Times are UTC. Paris summer time (CEST) = UTC+2, so 09:00-18:00 Paris = 07:00-16:00 UTC.
    - cron: '0 7-16 * * 1-5'       # hourly, 09:00-18:00 Paris, Mon-Fri
    - cron: '0 0,3,6,18,21 * * 1-5' # every 3h outside that window, Mon-Fri
    - cron: '0 */3 * * 0,6'        # every 3h all day, Sat & Sun
    # ── Strasbourg EP plenary weeks: ramp to every 20 min, daytime 07:00-18:00 UTC ──
    # (09:00-20:00 Paris CEST / 08:00-19:00 CET). day-of-month + month target the
    # exact 4-day part-sessions (Mon-Thu). Big plenary days produce 30-50+ photos
    # and the 60-item cap drops the rest on an hourly cadence — see CLAUDE.md.
    # NOTE: cron has no year field; these are 2026 dates and shift ~a week each
    # year — update annually from the official EP calendar.
    - cron: '*/20 7-18 6-9 7 *'    # Jul 6-9
    - cron: '*/20 7-18 14-17 9 *'  # Sep 14-17
    - cron: '*/20 7-18 5-8 10 *'   # Oct 5-8
    - cron: '*/20 7-18 19-22 10 *' # Oct 19-22
    - cron: '*/20 7-18 23-26 11 *' # Nov 23-26
    - cron: '*/20 7-18 14-17 12 *' # Dec 14-17
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      init_mode:
        description: 'Run in init mode (seed cache, no notifications)'
        required: false
        default: 'false'

# During plenary weeks the hourly and every-30-min schedules collide at :00.
# Serialize runs so two workers don't both read the same seen.json and each
# fire a notification for the same new photo (the cache is per-run_id).
concurrency:
  group: photo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth feedparser requests supabase
          playwright install chromium
          playwright install-deps chromium

      - name: Restore seen-items cache
        uses: actions/cache@v4
        with:
          path: photo_library_seen.json
          key: seen-items-${{ github.run_id }}
          restore-keys: seen-items-

      - name: Run monitor (with virtual display)
        env:
          DISPLAY: ':99'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          if [ "${{ github.event.inputs.init_mode }}" = "true" ]; then
            python3 photo_library_monitor.py --init
          else
            python3 photo_library_monitor.py
          fi

      - name: Save seen-items
        uses: actions/cache/save@v4
        if: always()
        with:
          path: photo_library_seen.json
          key: seen-items-${{ github.run_id }}
