name: Photo Library Monitor

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright playwright-stealth feedparser requests
          playwright install chromium
          playwright install-deps chromium

      - name: Restore seen-items cache
        uses: actions/cache@v4
        with:
          path: photo_library_seen.json
          key: seen-items-${{ github.run_id }}
          restore-keys: seen-items-

      - name: Run monitor (with virtual display)
        env:
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          python3 photo_library_monitor.py

      - name: Save seen-items
        uses: actions/cache/save@v4
        if: always()
        with:
          path: photo_library_seen.json
          key: seen-items-${{ github.run_id }}
