name: Welcome New Subscribers

on:
  push:
    branches: [main]
    paths: ['subscribers.json']
  workflow_dispatch:
    inputs:
      send_to_all:
        description: 'Send to all subscribers'
        required: false
        default: 'true'

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Send welcome emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_TO_ALL: ${{ github.event.inputs.send_to_all || 'false' }}
        run: python welcome_email.py
