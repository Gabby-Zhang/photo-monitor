name: Séjourné EU AV Monitor

# Cloud-only (no Windows PC involved — sejourn_photo_monitor.py is plain
# HTTP, no login/browser needed, so it just stays on GitHub Actions like
# the rest of photo_library_monitor.py). High-frequency during UK waking
# hours, lower overnight. See CLAUDE.md ("EU AV 监控：云端专属、高频轮询").

on:
  schedule:
    # Times are UTC. UK 07:00-20:00 = 07:00-20:00 UTC in winter (GMT); shift
    # both blocks 1h earlier (06:00-19:00 UTC day / 19-23,0-5 night) once UK
    # clocks go to BST (last Sunday in March) — and back again in October.
    - cron: '*/10 7-19 * * *'       # UK daytime, every 10 min
    - cron: '0 0-6,20-23 * * *'     # UK nighttime, hourly
  workflow_dispatch:

concurrency:
  group: sejourn-photo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Restore dedup state cache
        uses: actions/cache@v4
        with:
          path: photo_sync_state.json
          key: sejourn-av-state-${{ github.run_id }}
          restore-keys: sejourn-av-state-

      - name: Run monitor
        run: python3 sejourn_photo_monitor.py

      - name: Save dedup state cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: photo_sync_state.json
          key: sejourn-av-state-${{ github.run_id }}
